name: Publish AgentR to NuGet

on:
  release:
    types: [published] # Triggers only when you click "Publish Release" in GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AgentR.sln

    - name: Build (Release)
      run: dotnet build AgentR.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test AgentR.sln --no-build --verbosity normal

    - name: Pack Client SDK
      run: dotnet pack src/AgentR.Client/AgentR.Client.csproj --configuration Release --output ./nupkgs

    - name: Pack Shared Protocol
      run: dotnet pack src/AgentR.Shared/AgentR.Shared.csproj --configuration Release --output ./nupkgs

    - name: Pack Worker Template
      run: dotnet pack templates/AgentR.Worker/AgentRWorker.csproj --configuration Release --output ./nupkgs

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

  publish-python:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name == 'release'
    permissions:
      id-token: write  # Required for Trusted Publishers (OIDC)
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: cd src/AgentR.Python && python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: src/AgentR.Python/dist/
