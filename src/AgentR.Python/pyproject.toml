[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentr"
version = "1.0.0"
authors = [
  { name="Digvijay", email="digvijay@live.com" },
]
description = "Professional Real-time Transport Protocol for Distributed AI Agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "signalrcore",
    "pyjwt",
    "msgpack",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio"
]

[project.urls]
Repository = "https://github.com/Digvijay/AgentR"
Documentation = "https://github.com/Digvijay/AgentR/tree/main/docs"
Issues = "https://github.com/Digvijay/AgentR/issues"
